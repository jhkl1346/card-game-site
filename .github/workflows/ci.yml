name: CI

on:
  pull_request:
  push:
    branches: [main]

# 같은 브랜치에 새 커밋이 오면 이전 실행을 취소해 무료 실행 시간을 아낀다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: 설치 · 린트 · 타입 검사 · 테스트 · 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: pnpm 설치 (package.json의 packageManager 버전 사용)
        uses: pnpm/action-setup@v6

      - name: Node.js 설치 + pnpm 의존성 캐시
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 린트
        run: pnpm lint

      - name: 타입 검사
        run: pnpm typecheck

      - name: 단위 테스트 (족보 전수 테스트 포함)
        run: pnpm test

      - name: 빌드
        run: pnpm build
