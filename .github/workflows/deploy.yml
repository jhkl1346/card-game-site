name: 배포

# 자동 배포 없이, Actions 탭에서 "Run workflow"를 눌러 직접 실행한다 (PROMPT.md: workflow_dispatch로 시작)
on:
  workflow_dispatch:

permissions:
  contents: read

# 배포가 겹치지 않게 한 번에 하나만
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Render에 배포
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: main 브랜치에서만 배포
        if: github.ref != 'refs/heads/main'
        run: |
          echo "main 브랜치에서만 배포할 수 있습니다. (지금: ${{ github.ref_name }})"
          exit 1

      - name: Render 배포 훅 호출
        env:
          # Render 서비스 Settings의 Deploy Hook 주소. GitHub Secrets에만 저장한다
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL 시크릿이 없습니다. docs/deploy-guide.md 4단계를 참고해 등록해 주세요."
            exit 1
          fi
          # 주소가 로그에 찍히지 않도록 출력 없이 상태 코드만 확인한다
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$RENDER_DEPLOY_HOOK_URL")
          echo "Render 응답: $code"
          case "$code" in
            200) echo "배포를 시작했습니다. Render 화면의 Events에서 진행 상황을 볼 수 있습니다." ;;
            202) echo "이미 진행 중인 배포가 있습니다." ;;
            *) echo "배포를 시작하지 못했습니다."; exit 1 ;;
          esac
